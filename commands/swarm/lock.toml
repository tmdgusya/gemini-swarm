description = "Acquire a lock on a file path to prevent concurrent access by agents"
prompt = """
The user wants to acquire a file lock. Parse their request: {{args}}

Extract:
1. The file path to lock
2. The agent name requesting the lock
3. Optional TTL in milliseconds

Then call the `swarm_lock` tool with:
- path: the file path to lock
- agent: the agent name requesting the lock
- ttlMs: the TTL in milliseconds (if provided)

Report whether the lock was successfully acquired.
"""
